[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-review-assistant"
version = "0.1.0"
description = "Hotel search for Indonesian travellers based on aspect-level sentiment in guest reviews"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Clarice Arlin Wijaya" }]
dependencies = ["numpy==2.1.3", "scikit-learn==1.5.2", "scipy==1.14.1", "joblib==1.4.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.8.4", "pre-commit==4.0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
